name: Build & Release NexusPad APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare debug keystore for APK signing
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --tests com.example.ExampleUnitTest

      - name: Build NexusPad APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare release APK & version tag
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v1.0.${{ github.run_number }}"
          fi
          APK_NAME="NexusPad-${TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "${APK_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexusPad-APK
          path: ${{ steps.meta.outputs.apk_name }}

      - name: Generate What's New release notes
        run: |
          {
            echo "## NexusPad — Virtual Controller & Keyboard Mapper for GeForce NOW"
            echo ""
            echo "Download \`${{ steps.meta.outputs.apk_name }}\` below and install it on your Android device."
            echo ""
            echo "## What's New"
            echo ""
            if [ -s RELEASE_NOTES.md ]; then
              cat RELEASE_NOTES.md
              echo ""
            fi
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
            if [ -n "$PREV_TAG" ]; then
              COMMITS=$(git log "${PREV_TAG}..HEAD" -n 25 --no-merges --pretty=format:"- %s" || true)
            else
              COMMITS=$(git log -n 15 --no-merges --pretty=format:"- %s" || true)
            fi
            if [ -n "$COMMITS" ]; then
              echo "### Commit Changes"
              echo "$COMMITS"
              echo ""
            elif [ ! -s RELEASE_NOTES.md ]; then
              echo "- Maintenance update and build improvements."
              echo ""
            fi
            echo "### Quick Setup"
            echo "1. Install \`${{ steps.meta.outputs.apk_name }}\` on your Android phone or tablet."
            echo "2. Open **NexusPad** and go to **Setup** (or tap the readiness cards in **Cockpit**)."
            echo "3. Grant **Display over other apps** to float custom virtual controls above GeForce NOW."
            echo "4. Enable **NexusPad Gamepad & Keyboard** IME for live \`KeyEvent\` dispatch, or test layouts directly in the built-in **Sandbox**."
          } > release_body.md

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: NexusPad ${{ steps.meta.outputs.tag }}
          body_path: release_body.md
          generate_release_notes: true
          make_latest: true
          files: |
            ${{ steps.meta.outputs.apk_name }}
