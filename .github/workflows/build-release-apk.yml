name: Build & Release XenosPad APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Publish GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Prepare persistent signing keystore (required for in-place APK upgrades)
        env:
          NEXUSPAD_KEYSTORE_BASE64: ${{ secrets.NEXUSPAD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$NEXUSPAD_KEYSTORE_BASE64" ]; then
            echo "Using repository secret NEXUSPAD_KEYSTORE_BASE64"
            printf '%s' "$NEXUSPAD_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > debug.keystore
          elif [ -f debug.keystore.base64 ]; then
            echo "Using committed debug.keystore.base64 for consistent in-place updates"
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
          else
            echo "::notice::Using deterministic repo-scoped CI debug signing key so every GitHub Release updates cleanly in-place. (Optional: set NEXUSPAD_KEYSTORE_BASE64 secret for a private release key.)"
            python3 .github/scripts/generate_deterministic_debug_keystore.py "${{ github.repository }}" debug.keystore
          fi
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "Alias|SHA256|Valid"

      - name: Restore Firebase google-services.json (optional, enables Cloud Save in GitHub APKs)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "Restoring app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret"
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\r\n ' | base64 -d > app/google-services.json
          elif [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "Restoring app/google-services.json from GOOGLE_SERVICES_JSON secret"
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          elif [ -f app/google-services.json ]; then
            echo "Using committed app/google-services.json"
          else
            echo "::warning::app/google-services.json not found. Google Sign-In / Cloud Save will be disabled in this APK until you add the GOOGLE_SERVICES_JSON and NEXUSPAD_KEYSTORE_BASE64 repository secrets."
          fi
          if [ -f app/google-services.json ]; then
            python3 -c 'import json; d=json.load(open("app/google-services.json")); print("Verified google-services.json for Firebase project:", d.get("project_info", {}).get("project_id"))'
          fi

      - name: Compute release version & APK metadata
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v1.0.${{ github.run_number }}"
          fi
          VERSION_NAME="${TAG#v}"
          VERSION_CODE=$((100 + ${{ github.run_number }}))
          APK_NAME="XenosPad-${TAG}.apk"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "apk_name=${APK_NAME}" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        env:
          APP_VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          APP_VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: gradle :app:testDebugUnitTest --tests com.example.ExampleUnitTest

      - name: Build XenosPad APK
        env:
          APP_VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          APP_VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: gradle :app:assembleDebug --stacktrace

      - name: Package & verify versioned release APK signature
        id: verify
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "${{ steps.meta.outputs.apk_name }}"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          APKSIGNER=$(find "$SDK_ROOT/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$APKSIGNER" ]; then
            VERIFY_OUT=$("$APKSIGNER" verify --print-certs "${{ steps.meta.outputs.apk_name }}")
            echo "$VERIFY_OUT"
            CERT_SHA256=$(echo "$VERIFY_OUT" | grep -m1 "certificate SHA-256 digest:" | awk '{print $NF}')
            echo "cert_sha256=${CERT_SHA256}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: XenosPad-APK
          path: ${{ steps.meta.outputs.apk_name }}

      - name: Generate What's New release notes
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          APK_NAME: ${{ steps.meta.outputs.apk_name }}
          CERT_SHA256: ${{ steps.verify.outputs.cert_sha256 }}
          OUTPUT_FILE: release_body.md
        run: python3 .github/scripts/generate_release_notes.py

      - name: Create GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          APK_NAME: ${{ steps.meta.outputs.apk_name }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TITLE="XenosPad ${TAG}"
          DELAYS=(5 10 15 25 40)
          MAX_ATTEMPTS=6

          retry() {
            local desc="$1"
            shift
            for ATTEMPT in $(seq 1 "$MAX_ATTEMPTS"); do
              echo "${desc} (attempt ${ATTEMPT}/${MAX_ATTEMPTS})..."
              if "$@"; then
                return 0
              fi
              if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
                local sleep_sec="${DELAYS[$((ATTEMPT - 1))]}"
                echo "::warning::${desc} failed on attempt ${ATTEMPT}/${MAX_ATTEMPTS}. Retrying in ${sleep_sec}s..."
                sleep "$sleep_sec"
              fi
            done
            echo "::error::${desc} failed after ${MAX_ATTEMPTS} attempts."
            return 1
          }

          # 1. Push the Git tag first so GitHub Releases API doesn't have to create the ref during POST /releases
          ensure_tag() {
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "Tag ${TAG} already exists on origin."
              return 0
            fi
            git tag -f "$TAG" "$TARGET_SHA"
            git push origin "refs/tags/${TAG}"
          }
          retry "Ensure Git tag ${TAG}" ensure_tag

          # 2. Create a draft release if one doesn't already exist (prevents empty public releases & duplicate drafts)
          ensure_release() {
            local view_out=""
            if view_out=$(gh release view "$TAG" 2>&1); then
              echo "Release ${TAG} already exists."
              return 0
            fi
            if ! printf '%s' "$view_out" | grep -qiE "release not found|HTTP 404"; then
              echo "$view_out"
              return 1
            fi
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes-file release_body.md \
              --draft
          }
          retry "Create draft GitHub Release ${TAG}" ensure_release

          # 3. Upload the APK asset cleanly (retried independently from release creation)
          retry "Upload ${APK_NAME} to Release ${TAG}" \
            gh release upload "$TAG" "$APK_NAME" --clobber

          # 4. Publish the draft release BEFORE setting --latest (avoids HTTP 422 'Latest release cannot be draft')
          retry "Publish GitHub Release ${TAG}" \
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes-file release_body.md \
              --draft=false \
              --prerelease=false

          # 5. Explicitly mark as Latest release (GitHub also marks newly published releases as latest automatically)
          if ! retry "Mark Release ${TAG} as latest" gh release edit "$TAG" --latest; then
            echo "::warning::Release ${TAG} was published with ${APK_NAME}, but explicitly setting --latest failed due to a transient GitHub API error."
          fi

          echo "GitHub Release ${TAG} published successfully."
